name: Build Horizon ARM64

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Configure Ubuntu Multiarch Repositories (ports.ubuntu.com)
        run: |
          # Restrict existing mirrors (both classic and deb822 ubuntu.sources) to amd64
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Suites:/Architectures: amd64\nSuites:/g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo sed -i -e 's/deb http/deb [arch=amd64] http/g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo sed -i -e 's/deb https/deb [arch=amd64] https/g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo sed -i -e 's/deb \[arch=amd64\] \[arch=amd64\]/deb [arch=amd64]/g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true

          # Add official Ubuntu Ports mirror for arm64 packages
          UBUNTU_CODENAME=$(lsb_release -cs)
          cat << EOF | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_CODENAME} main universe restricted multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_CODENAME}-updates main universe restricted multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${UBUNTU_CODENAME}-security main universe restricted multiverse
          EOF

          sudo dpkg --add-architecture arm64
          sudo apt-get update

          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libasound2-dev:arm64 \
            libudev-dev:arm64 \
            pkg-config

      - name: Clone Horizon upstream
        run: |
          git clone --depth 1 https://github.com/horizon-rust/horizon.git upstream-horizon

      - name: Build Horizon Client and Prepare
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: "aarch64-linux-gnu-gcc"
        run: |
          cd upstream-horizon
          cargo build --target aarch64-unknown-linux-gnu --profile fast --bin horizon-client --bin horizon-prepare
          aarch64-linux-gnu-strip target/aarch64-unknown-linux-gnu/fast/horizon-client
          aarch64-linux-gnu-strip target/aarch64-unknown-linux-gnu/fast/horizon-prepare

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: horizon-arm64-binaries
          path: |
            upstream-horizon/target/aarch64-unknown-linux-gnu/fast/horizon-client
            upstream-horizon/target/aarch64-unknown-linux-gnu/fast/horizon-prepare
