name: Build Horizon Launcher APK

on:
  push:
    branches: [ "main", "master", "**" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Horizon Launcher APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK & NDK
        run: |
          echo "Accepting Android SDK licenses..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Installing NDK & CMake..."
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Grant Executable Permissions
        run: chmod +x gradlew

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Horizon Debug,O=Horizon,C=US"

      - name: Build Debug & Release APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/HorizonLauncher-v2.5.0-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/HorizonLauncher-v2.5.0-release-unsigned.apk
          ls -lh dist/

      - name: Upload Horizon Launcher Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HorizonLauncher-v2.5.0-debug-apk
          path: dist/HorizonLauncher-v2.5.0-debug.apk
          if-no-files-found: error

      - name: Upload Horizon Launcher Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HorizonLauncher-v2.5.0-release-apk
          path: dist/HorizonLauncher-v2.5.0-release-unsigned.apk
          if-no-files-found: error
