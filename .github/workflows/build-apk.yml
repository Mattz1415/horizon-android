name: Build Horizon Android APK

on:
  push:
    branches: [ android, main ]
  pull_request:
    branches: [ android, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Horizon 26.3 APK (arm64-v8a & x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
      NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android NDK & SDK Components
        run: |
          echo "Accepting Android SDK licenses..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Native Rust Engine (aarch64-linux-android)
        run: |
          mkdir -p packaging/android/src/main/jniLibs/arm64-v8a
          cargo ndk -t arm64-v8a --platform 28 build --release -p horizon-android
          cp target/aarch64-linux-android/release/libhorizon_android.so packaging/android/src/main/jniLibs/arm64-v8a/

      - name: Compile Native Rust Engine (x86_64-linux-android)
        run: |
          mkdir -p packaging/android/src/main/jniLibs/x86_64
          cargo ndk -t x86_64 --platform 28 build --release -p horizon-android
          cp target/x86_64-linux-android/release/libhorizon_android.so packaging/android/src/main/jniLibs/x86_64/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble APKs via Gradle
        working-directory: packaging/android
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace || gradle assembleDebug --no-daemon

      - name: Stage Artifacts
        run: |
          mkdir -p dist
          find packaging/android -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload Horizon Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: HorizonAndroid-26.3-APKs
          path: dist/*.apk
          if-no-files-found: warn
